<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>晶枝花园</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse,#284451,#061b27);color:#fff3d0;height:100svh;display:grid;place-items:center;overflow:hidden;font:14px system-ui}main{position:relative;height:min(100svh,200vw,900px);aspect-ratio:1/2}canvas{width:100%;height:100%;display:block;touch-action:none;box-shadow:0 0 80px #001d30}nav{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));width:100%;display:flex;justify-content:center;gap:6px}button{font:600 13px system-ui;background:linear-gradient(#284c60,#163449);color:#fff0c3;border:1px solid #e4ce9277;border-radius:22px;padding:10px 12px;cursor:pointer}button:disabled{opacity:.45}#loading{position:absolute;inset:0;display:grid;place-content:center;background:#17364cf2;text-align:center;z-index:2}#loading[hidden]{display:none}#loading p{color:#abcbd0;font-size:12px}dialog{background:#112e40;color:#e2f0ed;border:1px solid #f4d79f80;border-radius:16px;width:min(700px,94vw);max-height:85svh;overflow:auto}pre{font-size:11px;white-space:pre-wrap}#qa{display:none}</style><main><canvas aria-label="晶枝花园，划断树枝收取晶果"></canvas><div id="loading">晶枝花园<p>正在铺好花园…</p></div><nav><button id="same-play" disabled>同树再试</button><button id="retry" disabled>换色再玩</button><button id="sound" disabled>声音 开</button><button id="qa">记录</button></nav></main><dialog><button id="close">关闭</button><button id="same">同树重试</button><button id="export">导出记录</button><pre></pre></dialog><script type="module" src="game.js"></script></html>
