<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>短体验</title><style>*{box-sizing:border-box}body{margin:0;background:#111c26;color:#f6efe0;font-family:system-ui,sans-serif}main{max-width:420px;margin:8vh auto;padding:28px}h1{font-size:28px;font-weight:600}p{line-height:1.8;color:#bac7ca}a{display:block;text-decoration:none;background:#eedbb4;color:#14282c;padding:22px;border-radius:16px;margin-top:18px;font-size:18px}small{display:block;margin-top:26px;line-height:1.7;color:#a6b7ba}a:focus-visible{outline:3px solid #6ed4bf;outline-offset:5px}</style></head><body><main><h1>两个短体验</h1><p>可以随时停下或离开。</p><a id="one">打开第一个体验</a><a id="two">打开第二个体验</a><small>无需登录。体验中记录匿名操作事件，<br>不采集姓名、录音或录像。</small></main><script>
let order;try{order=JSON.parse(sessionStorage.getItem('recovery001-gen2-order'))}catch{}if(!Array.isArray(order)||order.length!==2||new Set(order).size!==2||order.some(x=>!['g21','g22'].includes(x))){order=Math.random()<.5?['g21','g22']:['g22','g21'];try{sessionStorage.setItem('recovery001-gen2-order',JSON.stringify(order))}catch{}}
const qa=new URLSearchParams(location.search).get('qa')==='1';for(const [i,id] of ['one','two'].entries())document.getElementById(id).href='../'+order[i]+'/index.html?novice=1'+(qa?'&qa=1':'');
</script></body></html>
