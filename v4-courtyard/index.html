<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ece9df"><title>回潮小院 · 一方晴日</title><link rel="stylesheet" href="style.css"></head><body>
<main>
 <header><div><span class="eyebrow">A LITTLE COURTYARD</span><h1>回潮小院<span>一方晴日</span></h1></div><button id="sound" class="icon" aria-label="开启声音">♪<small>声音关</small></button></header>
 <section class="weather"><div><span class="sun">☀</span><b id="season">第一阵潮</b><span id="step">再行动 3 步 · 潮来</span></div><div class="dots" id="dots"></div></section>
 <div id="forecast" class="forecast" aria-label="下一潮预告"></div>
 <section class="court" aria-label="庭院">
  <div class="water"><i></i><i></i><i></i></div><div class="garden-edge"></div>
  <div class="lanes" id="lanes"></div>
  <div class="signature"><span id="mark">✿</span> 留一点自己的颜色</div>
  <div class="petals"><i></i><i></i><i></i></div>
 </section>
 <div class="message" id="message" role="status" aria-live="polite">先选一件杂物，再放进打包坞</div>
 <section class="tools">
  <button id="dock" class="dock" aria-label="放入打包坞"><span class="dock-pieces" id="dockPieces"></span><b id="dockLabel">打包坞</b><small id="dockHint">选中杂物后放入</small></button>
  <button id="release" class="release"><b>推出小包</b><small>冲走一道杂物</small></button>
  <button id="board" class="board"><span>▰ <b id="boardCount">0</b></span><small>挡潮板</small></button>
 </section>
 <button id="tide" class="tide" hidden>让这一潮进来 <span>预告不会偷偷改变</span></button>
 <div id="ending" class="ending" hidden><b id="endingTitle"></b><span id="endingText"></span></div>
 <footer><button id="cancel">取消选择</button><button id="restart">重新开始</button><button id="records">匿名记录</button></footer>
 <p class="footnote">无倒计时 · 随时离开 <span id="qaLabel"></span></p>
 <details id="log"><summary>记录状态 / 导出</summary><pre id="status"></pre><button id="export">导出本次记录</button></details>
</main>
<dialog id="welcome"><div class="intro-art">✿</div><span class="eyebrow">MAKE A LITTLE ROOM</span><h2>潮退了，<br>小院还在。</h2><p>留下你喜欢的一抹颜色</p><div class="swatches"><button data-color="coral" aria-label="选择珊瑚色" class="coral chosen">✿</button><button data-color="blue" aria-label="选择湖蓝色" class="blue">✿</button><button data-color="gold" aria-label="选择暖黄色" class="gold">✿</button></div><button id="begin">打开小院 <span>↗</span></button><small>整理、留住，然后看潮水经过。</small></dialog>
<script src="analytics-config.js"></script><script type="module" src="app.js"></script></body></html>
